name: energy_tracker_pro
description: Energy Tracker Pro - Monitor your electricity usage and stress
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Charts
  fl_chart: ^0.66.0
  
  # Image Picker
  image_picker: ^1.0.5
  
  # Email Notifications
  mailer: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true